    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Pulse Animation for Map Markers - FIXED ANCHORING */
        .ponto-piscando-container {
            width: 14px !important;
            height: 14px !important;
            margin-left: -7px !important;
            margin-top: -7px !important;
        }

        .ponto-piscando {
            background-color: #2e7d32;
            border-radius: 50%;
            border: 2px solid #ffffff;
            width: 14px;
            height: 14px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 0 10px rgba(46, 125, 50, 0.8);
            box-sizing: border-box;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        /* Continuous Pulse Aura (Radar / Sonar Effect) centered properly */
        .ponto-piscando::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 24px;
            height: 24px;
            margin-top: -12px;
            margin-left: -12px;
            border-radius: 50%;
            background-color: rgba(46, 125, 50, 0.6);
            animation: aura-pulso 1.8s infinite ease-out;
            pointer-events: none;
            z-index: -1;
        }

        .ponto-piscando:hover {
            transform: scale(1.35);
            background-color: #1b5e20;
        }

        .ponto-piscando.destaque {
            background-color: #eab308;
            border-color: #ffffff;
            box-shadow: 0 0 14px rgba(234, 179, 8, 0.9);
            transform: scale(1.3);
            z-index: 1000 !important;
        }

        .ponto-piscando.destaque::after {
            background-color: rgba(234, 179, 8, 0.7);
            animation: aura-pulso 1.2s infinite ease-out;
            width: 32px;
            height: 32px;
            margin-top: -16px;
            margin-left: -16px;
        }

        @keyframes aura-pulso {
            0% {
                transform: scale(0.3);
                opacity: 0.95;
            }
            100% {
                transform: scale(1.8);
                opacity: 0;
            }
        }

        /* Leaflet Custom Popup Styling */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            padding: 4px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .leaflet-popup-content {
            margin: 12px 16px;
            line-height: 1.5;
        }

        /* Tooltip Custom Style */
        .custom-tooltip {
            background-color: #1b5e20;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: 600;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .custom-tooltip::before {
            border-top-color: #1b5e20 !important;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Transition for drawer */
        .sidebar-transition {
            transition: transform 0.3s ease-in-out;
        }

            { id: 71, nome: "P.N. Marinho de Fernando de Noronha", uf: "PE", regiao: "Nordeste", lat: -3.8517, lng: -32.4425, hectares: "10.927 ha" },
            { id: 72, nome: "P.N. Marinho dos Abrolhos", uf: "BA", regiao: "Nordeste", lat: -17.7833, lng: -38.8167, hectares: "87.943 ha" },
            { id: 73, nome: "P.N. Montanhas do Tumucumaque", uf: "AP/PA", regiao: "Norte", lat: 0.0333, lng: -51.0500, hectares: "3.865.188 ha" },
            { id: 74, nome: "P.N. Nascentes do Lago Jari", uf: "AM", regiao: "Norte", lat: -7.5000, lng: -63.0167, hectares: "808.604 ha" },
            { id: 75, nome: "P.N. Serra da Mocidade", uf: "RR", regiao: "Norte", lat: 1.1492, lng: -61.8875, hectares: "376.812 ha" },
            { id: 76, nome: "P.N. Serra de Itabaiana", uf: "SE", regiao: "Nordeste", lat: -10.4000, lng: -37.4000, hectares: "8.024 ha" }
        ];

        // 2. VARIÁVEIS DE ESTADO
        let map;
        let markersMap = new Map(); // Guarda marcadores por ID
        let selectedRegion = 'TODAS';
        let isSatellite = false;
        let streetTileLayer, satelliteTileLayer;
        let selectedParkId = null;

        // Limites aproximados do Brasil para o Enquadramento
        const BRAZIL_BOUNDS = [
            [-33.75, -73.98], // Sudoeste
            [5.27, -34.79]    // Nordeste
        ];

        // 3. INICIALIZAÇÃO DO MAPA
        window.onload = function() {
            // Cria mapa centrado no Brasil
            map = L.map('map', {
                center: [-14.235, -51.925],
                zoom: 4,
                zoomControl: false
            });

            // Adiciona controle de Zoom no canto inferior direito
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // Camadas de Tile
            streetTileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            });

            satelliteTileLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri'
            });

            // Ativa camada padrão
            streetTileLayer.addTo(map);

            // Renderiza pontos e lista
            renderMapMarkers();
            renderParksList(parques);

            // Força ajuste no layout do mapa após o carregamento
            setTimeout(() => {
                map.invalidateSize();
            }, 300);
        };

        // 4. DESENHA MARCADORES NO MAPA COM ANCORAGEM FIXA
        function renderMapMarkers() {
            // Ícone verde de pulso contínuo com ancoragem precisa no centro (7, 7)
            const iconeVerde = L.divIcon({
                className: 'ponto-piscando-container',
                html: '<div class="ponto-piscando"></div>',
                iconSize: [14, 14],
                iconAnchor: [7, 7],
                popupAnchor: [0, -8]
            });

            parques.forEach(parque => {
                const marker = L.marker([parque.lat, parque.lng], { icon: iconeVerde });

                // Tooltip simples no hover
                marker.bindTooltip(parque.nome, {
                    permanent: false,
                    direction: 'top',
                    offset: [0, -8],
                    className: 'custom-tooltip'
                });

                // Conteúdo do Popup Estilizado
                const popupContent = `
                    <div class="text-slate-800">
                        <div class="flex items-center gap-1.5 mb-1 text-xs font-semibold text-emerald-700">
                            <i class="fa-solid fa-tree"></i>
                            <span>${parque.regiao} • ESTADO: ${parque.uf}</span>
                        </div>
                        <h3 class="font-bold text-sm text-slate-900 mb-1 leading-snug">${parque.nome}</h3>
                        <p class="text-[11px] text-emerald-800 font-semibold mb-1">
                            <i class="fa-solid fa-ruler-combined mr-1"></i>Área: ${parque.hectares}
                        </p>
                        <p class="text-xs text-slate-500 mb-3">
                            <i class="fa-solid fa-location-dot text-rose-500 mr-1"></i>
                            Coordenadas: ${parque.lat.toFixed(4)}, ${parque.lng.toFixed(4)}
                        </p>
                        <a href="https://parquesnacionaisinterculturais.ning.com/" target="_blank" 
                           class="inline-flex items-center justify-center gap-2 w-full py-2 px-3 bg-emerald-700 hover:bg-emerald-800 active:bg-emerald-900 text-white text-xs font-bold rounded-lg transition shadow-sm">
                            <span>Ler Artigos</span>
                            <i class="fa-solid fa-arrow-right text-[10px]"></i>
                        </a>
                    </div>
                `;

                marker.bindPopup(popupContent);

                // Adiciona evento de clique no marcador para sincronizar com a lista lateral
                marker.on('click', () => {
                    selectPark(parque.id);
                });

                marker.addTo(map);
                markersMap.set(parque.id, marker);
            });
        }

        // 5. RENDERIZA A LISTA LATERAL (AGRUPADA POR REGIÕES)
        function renderParksList(items) {
            const container = document.getElementById('parks-list');
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-slate-400">
                        <i class="fa-solid fa-tree-city text-3xl mb-2"></i>
                        <p class="text-sm font-medium">Nenhum parque encontrado</p>
                    </div>
                `;
                document.getElementById('list-count-badge').innerText = '0';
                document.getElementById('stat-count').innerText = '0';
                return;
            }

            document.getElementById('list-count-badge').innerText = items.length;
            document.getElementById('stat-count').innerText = items.length;

            // Agrupa os parques por região
            const ordemRegioes = ['Norte', 'Nordeste', 'Centro-Oeste', 'Sudeste', 'Sul'];
            
            ordemRegioes.forEach(regiao => {
                const parquesDaRegiao = items.filter(p => p.regiao === regiao);
                
                if (parquesDaRegiao.length > 0) {
                    // Header de cada Região
                    const regionHeader = document.createElement('div');
                    regionHeader.className = "sticky top-0 z-10 bg-emerald-800 text-white text-xs font-bold px-3 py-1.5 rounded-md my-2 flex justify-between items-center shadow-sm";
                    regionHeader.innerHTML = `
                        <span class="flex items-center gap-1.5">
                            <i class="fa-solid fa-compass text-emerald-300"></i> Região ${regiao}
                        </span>
                        <span class="bg-emerald-900/80 text-emerald-200 text-[10px] px-2 py-0.5 rounded-full font-extrabold">${parquesDaRegiao.length}</span>
                    `;
                    container.appendChild(regionHeader);

                    // Parques pertencentes a essa Região
                    parquesDaRegiao.forEach(parque => {
                        const card = document.createElement('div');
                        card.id = `park-card-${parque.id}`;
                        card.className = `p-3 bg-white hover:bg-emerald-50/60 border border-slate-200 rounded-lg cursor-pointer transition shadow-sm hover:border-emerald-300 flex items-center justify-between group my-1.5`;
                        card.onclick = () => selectPark(parque.id);

                        card.innerHTML = `
                            <div>
                                <h4 class="font-semibold text-xs sm:text-sm text-slate-800 group-hover:text-emerald-800 transition">${parque.nome}</h4>
                                <div class="flex items-center gap-2 mt-1">
                                    <span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-1.5 py-0.5 rounded">${parque.uf}</span>
                                    <span class="text-[11px] text-slate-500 font-medium"><i class="fa-solid fa-ruler-combined text-[10px] mr-1 text-emerald-600"></i>${parque.hectares}</span>
                                </div>
                            </div>
                            <i class="fa-solid fa-chevron-right text-xs text-slate-300 group-hover:text-emerald-600 transition group-hover:translate-x-0.5"></i>
                        `;

                        container.appendChild(card);
                    });
                }
            });
        }

        // 6. SELECIONA UM PARQUE (Ação do Usuário)
        function selectPark(id) {
            const parque = parques.find(p => p.id === id);
            if (!parque) return;

            selectedParkId = id;

            // Foca o mapa no ponto do parque
            map.flyTo([parque.lat, parque.lng], 8, {
                animate: true,
                duration: 1.2
            });

            // Destaca o marcador no mapa sem deslocar a posição central do marcador
            markersMap.forEach((marker, markerId) => {
                const el = marker.getElement();
                if (el) {
                    const innerElem = el.querySelector('.ponto-piscando');
                    if (innerElem) {
                        if (markerId === id) {
                            innerElem.classList.add('destaque');
                        } else {
                            innerElem.classList.remove('destaque');
                        }
                    }
                }
            });

            // Abre o popup do marcador
            const marker = markersMap.get(id);
            if (marker) {
                setTimeout(() => {
                    marker.openPopup();
                }, 400);
            }

            // Destaca o card na lista lateral
            highlightParkInList(id);

            // Em telas pequenas (mobile), recolhe a sidebar ao selecionar um parque
            if (window.innerWidth < 1024) {
                toggleSidebar(false);
            }
        }

        // Highlight na lista
        function highlightParkInList(id) {
            document.querySelectorAll('#parks-list > div').forEach(card => {
                card.classList.remove('bg-emerald-100/70', 'border-emerald-500', 'ring-1', 'ring-emerald-500');
            });

            const selectedCard = document.getElementById(`park-card-${id}`);
            if (selectedCard) {
                selectedCard.classList.add('bg-emerald-100/70', 'border-emerald-500', 'ring-1', 'ring-emerald-500');
                selectedCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        // 7. FILTRAGEM (BUSCA E REGIÃO)
        function filterParques() {
            const searchValue = document.getElementById('search-input').value.toLowerCase().trim();
            const clearBtn = document.getElementById('btn-clear-search');

            if (searchValue.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }

            const filtered = parques.filter(parque => {
                const matchesSearch = parque.nome.toLowerCase().includes(searchValue) || 
                                      parque.uf.toLowerCase().includes(searchValue);
                const matchesRegion = selectedRegion === 'TODAS' || parque.regiao === selectedRegion;

                return matchesSearch && matchesRegion;
            });

            // Atualiza visibilidade dos marcadores no mapa
            markersMap.forEach((marker, id) => {
                const isVisible = filtered.some(p => p.id === id);
                if (isVisible) {
                    if (!map.hasLayer(marker)) map.addLayer(marker);
                } else {
                    if (map.hasLayer(marker)) map.removeLayer(marker);
                }
            });

            // Atualiza a lista lateral
            renderParksList(filtered);
        }

        function setRegionFilter(region) {
            selectedRegion = region;

            // Atualiza botões
            document.querySelectorAll('.region-btn').forEach(btn => {
                if (btn.innerText.includes(region) || (region === 'TODAS' && btn.innerText === 'Todas') || (region === 'Centro-Oeste' && btn.innerText === 'C.Oeste')) {
                    btn.className = "region-btn active text-xs px-2.5 py-1 rounded-md border font-medium transition bg-emerald-700 text-white border-emerald-700";
                } else {
                    btn.className = "region-btn text-xs px-2.5 py-1 rounded-md border font-medium transition bg-white text-slate-600 border-slate-200 hover:bg-slate-100";
                }
            });

            filterParques();
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            filterParques();
        }

        // 8. REDEFINIR VISÃO DO MAPA
        function resetMapView() {
            map.fitBounds(BRAZIL_BOUNDS);
            
            // Remove destaque
            markersMap.forEach((marker) => {
                const el = marker.getElement();
                if (el) {
                    const innerElem = el.querySelector('.ponto-piscando');
                    if (innerElem) innerElem.classList.remove('destaque');
                }
            });

            map.closePopup();
        }

        // 9. TOGGLE DE CAMADA DO MAPA (RUA / SATÉLITE)
        function toggleTileLayer() {
            const btnText = document.getElementById('layer-btn-text');
            if (isSatellite) {
                map.removeLayer(satelliteTileLayer);
                streetTileLayer.addTo(map);
                btnText.innerText = 'Visão Satélite';
            } else {
                map.removeLayer(streetTileLayer);
                satelliteTileLayer.addTo(map);
                btnText.innerText = 'Visão Mapa';
            }
            isSatellite = !isSatellite;
        }

        // 10. CONTROLE DA SIDEBAR RESPONSIVA (MOBILE)
        function toggleSidebar(forceState) {
            const sidebar = document.getElementById('sidebar');
            if (forceState !== undefined) {
                if (forceState) {
                    sidebar.classList.remove('-translate-x-full');
                } else {
                    sidebar.classList.add('-translate-x-full');
                }
            } else {
                sidebar.classList.toggle('-translate-x-full');
            }
        }
    </script>
</body>
</html>
